<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperLens 设置</title>
    <style>
      body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 12px; }
      h1 { margin-bottom: 12px; }
      label { display: block; margin: 12px 0; }
      input[type="number"] { width: 80px; }
      button { margin-top: 12px; padding: 8px 12px; }
      #status { margin-top: 12px; color: #166534; }
    </style>
  </head>
  <body>
    <h1>PaperLens 设置</h1>
    <label>
      <input type="checkbox" id="autoOpenSidePanel" />
      解析后自动打开侧边面板
    </label>
    <label>
      证据片段最大数量：
      <input type="number" id="maxEvidenceSnippets" min="1" max="20" value="5" />
    </label>
    <button id="saveBtn">保存设置</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
