<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献链接</title>

<style>
body{
  font-family:Arial, sans-serif;
  margin:0;
  text-align:center;
  position:relative;
  z-index:0;
}

/* 背景图 */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("Linkbackground.jpg") center/cover no-repeat;
  z-index:-2;
}

/* 半透明遮罩 75% */
body::after{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.25); /* 25% 透明白色 */
  z-index:-1;
}

h1{
  margin-top:60px;
}

.links{
  margin-top:40px;
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

a.card{
  padding:15px 25px;
  background:white;
  border-radius:12px;
  text-decoration:none;
  color:#333;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
  transition:0.2s;
  font-weight:600;
}

a.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
}

.back{
  margin-top:50px;
  display:block;
}
</style>
</head>

<body>

<h1>📚 文献主页</h1>

<div class="links" id="linkBox">
  <a class="card" href="https://pubs.acs.org/journal/jacsat" target="_blank" rel="noopener">
Journal of the American Chemical Society
  </a>

  <a class="card" href="https://onlinelibrary.wiley.com/journal/15213773" target="_blank" rel="noopener">
Angewandte Chemie International Edition
  </a>
  <a class="card" href="https://www.nature.com/nchem/" target="_blank" rel="noopener">
Nature Chemistry
  </a>

  <a class="card" href="https://www.nature.com" target="_blank" rel="noopener">
Nature
  </a>
</div>

<a class="back" href="index.html">← 返回首页</a>
<script>
  const box = document.getElementById("linkBox");
  const links = Array.from(box.querySelectorAll("a.card"));

  links.sort((a, b) => {
    return a.textContent.localeCompare(b.textContent);
  });

  links.forEach(link => box.appendChild(link));
</script>
</body>
</html>
