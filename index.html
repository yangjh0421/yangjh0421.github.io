  --shadow:0 10px 30px rgba(0,0,0,.06);
}

body{
  margin:0;
  font-family:Arial,"PingFang SC","Microsoft YaHei";
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;

}

.container{
  max-width:1000px;

.nav a{

}

/* 卡片 */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--line);
  padding:24px;
  box-shadow:var(--shadow);
  transition:all .2s;
}

.card:hover{
  transform:translateY(-5px);
}

.icon{
  font-size:36px;
  margin-bottom:10px;
}

.title{
  font-size:20px;
  font-weight:600;
}

.desc{

  color:var(--muted);

footer{
