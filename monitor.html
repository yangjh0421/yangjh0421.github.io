<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Literature Monitor</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1a30; --panel2:#0c162b;
      --text:#e8eefc; --muted:#9fb0d0; --line:#233454;
      --brand:#6aa6ff; --danger:#ff6a6a; --ok:#58d48f; --warn:#ffcc66;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(106,166,255,.25), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(88,212,143,.18), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline}
    header{
      padding:28px 18px 18px;
      max-width:1280px; margin:0 auto;
      display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    }
    .title h1{margin:0;font-size:22px;letter-spacing:.2px}
    .title p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color:var(--text); padding:10px 12px;
      border-radius:12px; cursor:pointer;
      box-shadow:var(--shadow);
      font-size:13px;
      user-select:none;
    }
    .btn:hover{border-color:#2f4a7d}
    .btn.primary{border-color:rgba(106,166,255,.55)}
    .btn.ok{border-color:rgba(88,212,143,.55)}
    .btn.warn{border-color:rgba(255,204,102,.55)}
    .btn.danger{border-color:rgba(255,106,106,.55)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    main{max-width:1280px;margin:0 auto;padding:0 18px 40px}
    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:14px;
    }
    .section{
      padding:14px;
      border-bottom:1px solid var(--line);
      background:rgba(15,26,48,.7);
    }
    .section:last-child{border-bottom:none}
    .grid{
      display:grid;
      gap:10px;
    }
    .grid.keyword-add{
      grid-template-columns: 1.5fr .9fr auto;
      align-items:end;
    }
    .grid.filters{
      grid-template-columns: 1.2fr .8fr .8fr .8fr .8fr;
      align-items:end;
    }
    .grid.summary{
      grid-template-columns: repeat(4, minmax(180px,1fr));
    }
    @media (max-width: 980px){
      .grid.keyword-add,.grid.filters,.grid.summary{grid-template-columns:1fr 1fr}
    }
    @media (max-width: 640px){
      .grid.keyword-add,.grid.filters,.grid.summary{grid-template-columns:1fr}
    }
    input, select, textarea{
      width:100%;
      background:rgba(11,18,32,.65);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      outline:none;
    }
    input::placeholder, textarea::placeholder{color:rgba(159,176,208,.65)}
    label{font-size:12px;color:rgba(159,176,208,.95);display:block;margin-bottom:6px}
    .stat{
      border:1px solid rgba(35,52,84,.9);
      background:rgba(11,18,32,.45);
      border-radius:14px;
      padding:12px 14px;
      min-height:74px;
    }
    .stat .num{font-size:24px;font-weight:700;line-height:1.1}
    .stat .txt{font-size:12px;color:var(--muted);margin-top:6px}
    .muted{color:var(--muted)}
    .mono{font-family:var(--mono);font-size:12px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(106,166,255,.35);
      background:rgba(106,166,255,.08);
      color:rgba(232,238,252,.92);
      font-size:12px;
    }
    .chip .meta{color:var(--muted);font-size:11px}
    .chip button{
      border:none; background:transparent; color:var(--text); cursor:pointer;
      font-size:12px; padding:0;
    }
    .keyword-list{
      display:grid;
      gap:10px;
    }
    .keyword-item{
      border:1px solid rgba(35,52,84,.9);
      background:rgba(11,18,32,.32);
      border-radius:14px;
      padding:12px;
      display:grid;
      grid-template-columns: 1.5fr .8fr auto;
      gap:10px;
      align-items:center;
    }
    @media (max-width: 820px){
      .keyword-item{grid-template-columns:1fr}
    }
    .keyword-title{
      font-weight:600;
      line-height:1.4;
      word-break:break-word;
    }
    .keyword-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .iconbtn{
      padding:8px 10px; border-radius:10px; border:1px solid var(--line);
      background:rgba(255,255,255,.03); color:var(--text);
      cursor:pointer; font-size:12px;
    }
    .iconbtn:hover{border-color:#2f4a7d}
    .iconbtn.ok{border-color:rgba(88,212,143,.45)}
    .iconbtn.warn{border-color:rgba(255,204,102,.45)}
    .iconbtn.danger{border-color:rgba(255,106,106,.45)}

    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:1240px}
    th,td{
      padding:12px 12px;
      border-bottom:1px solid rgba(35,52,84,.7);
      vertical-align:top;
      font-size:13px;
    }
    th{
      position:sticky;top:0;
      background:rgba(12,22,43,.96);
      color:rgba(232,238,252,.92);
      text-align:left;
      z-index:2;
      white-space:nowrap;
    }
    tr:hover td{background:rgba(106,166,255,.05)}
    .tag{
      display:inline-flex; align-items:center;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid rgba(106,166,255,.35);
      background:rgba(106,166,255,.08);
      color:rgba(232,238,252,.92);
      margin:2px 6px 2px 0;
      font-size:12px;
      white-space:nowrap;
    }
    .tag.ok{
      border-color:rgba(88,212,143,.35);
      background:rgba(88,212,143,.08);
    }
    .tag.warn{
      border-color:rgba(255,204,102,.35);
      background:rgba(255,204,102,.08);
    }
    .result-title{
      font-weight:600;
      line-height:1.38;
    }
    .foot{
      padding:12px 14px;
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
      color:var(--muted);font-size:12px;
      background:rgba(15,26,48,.55);
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      background:rgba(12,22,43,.94);
      border:1px solid rgba(35,52,84,.9);
      padding:10px 12px;
      border-radius:14px;
      color:rgba(232,238,252,.92);
      font-size:13px;
      box-shadow:0 16px 50px rgba(0,0,0,.45);
      display:none;
      max-width:min(900px, calc(100vw - 24px));
      line-height:1.4;
      z-index:99;
    }
    .toast.show{display:block}
    .empty{
      padding:18px;
      color:var(--muted);
      line-height:1.6;
    }
    .help{
      font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;
    }
    .kbd{
      font-family:var(--mono);
      border:1px solid rgba(159,176,208,.3);
      padding:2px 6px;border-radius:8px;
      background:rgba(255,255,255,.04);
      color:rgba(232,238,252,.85);
    }
  </style>
</head>
<body>
<header>
  <div class="title">
    <h1>Literature Monitor</h1>
    <p>
      自定义关键词监控页。支持单独刷新或一键刷新全部，按 DOI 去重，并可把结果一键加入 <span class="mono">literature.html</span> 的本地文献库。
    </p>
  </div>
  <div class="toolbar">
    <button class="btn ok" id="btnRefreshAll">刷新全部关键词</button>
    <button class="btn" id="btnExportMonitor">导出监控数据</button>
    <button class="btn" id="btnImportMonitor">导入监控数据</button>
    <button class="btn danger" id="btnClearResults">清空结果</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="section">
      <div class="grid keyword-add">
        <div>
          <label>新增关键词</label>
          <input id="kwText" placeholder="例如：dynamic combinatorial chemistry" />
        </div>
        <div>
          <label>备注（可选）</label>
          <input id="kwNote" placeholder="例如：核心主题 / project1" />
        </div>
        <div>
          <button class="btn primary" id="btnAddKeyword">添加关键词</button>
        </div>
      </div>
      <div class="help">
        建议：一个关键词尽量对应一个明确主题。你也可以加入短语，比如 <span class="mono">transient micellar environments</span>。快捷键：<span class="kbd">K</span> 聚焦关键词输入框。
      </div>
    </div>

    <div class="section">
      <div class="grid filters">
        <div>
          <label>搜索结果筛选</label>
          <input id="searchResults" placeholder="搜索标题 / 作者 / DOI / 期刊 / 命中关键词 ..." />
        </div>
        <div>
          <label>时间范围</label>
          <select id="timeRange">
            <option value="7">最近 7 天</option>
            <option value="30" selected>最近 30 天</option>
            <option value="90">最近 90 天</option>
            <option value="365">最近 365 天</option>
          </select>
        </div>
        <div>
          <label>每个关键词抓取条数</label>
          <select id="rowsPerKeyword">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="50">50</option>
          </select>
        </div>
        <div>
          <label>结果排序</label>
          <select id="sortResults">
            <option value="fetched_desc">最近抓取</option>
            <option value="year_desc">年份（新→旧）</option>
            <option value="year_asc">年份（旧→新）</option>
            <option value="title_asc">标题（A→Z）</option>
          </select>
        </div>
        <div>
          <label>状态筛选</label>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="new">仅未读</option>
            <option value="read">仅已读</option>
            <option value="added">仅已加入文献库</option>
            <option value="not_added">仅未加入文献库</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="grid summary">
        <div class="stat">
          <div class="num" id="statKeywords">0</div>
          <div class="txt">关键词总数</div>
        </div>
        <div class="stat">
          <div class="num" id="statResults">0</div>
          <div class="txt">去重后结果数</div>
        </div>
        <div class="stat">
          <div class="num" id="statUnread">0</div>
          <div class="txt">未读条目</div>
        </div>
        <div class="stat">
          <div class="num" id="statAdded">0</div>
          <div class="txt">已加入文献库</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div style="font-weight:600; margin-bottom:10px;">关键词列表</div>
      <div id="keywordList" class="keyword-list"></div>
    </div>

    <div class="section" style="padding:0;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:34%">标题</th>
              <th style="width:16%">作者</th>
              <th style="width:7%">年</th>
              <th style="width:12%">期刊/会议</th>
              <th style="width:12%">DOI</th>
              <th style="width:12%">命中关键词</th>
              <th style="width:7%">状态</th>
              <th style="width:14%">操作</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>

      <div class="foot">
        <div>监控页结果会保存在本浏览器的 <span class="mono">localStorage</span></div>
        <div>加入文献库时会写入 <span class="mono">literature_items_v2</span></div>
      </div>
    </div>
  </div>
</main>

<input type="file" id="fileInputMonitor" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEYWORDS_KEY = "monitor_keywords_v1";
  const RESULTS_KEY = "monitor_results_v1";
  const LITERATURE_KEY = "literature_items_v2";

  let keywords = [];
  let results = [];
  let refreshingAll = false;

  const kwText = document.getElementById("kwText");
  const kwNote = document.getElementById("kwNote");
  const btnAddKeyword = document.getElementById("btnAddKeyword");
  const btnRefreshAll = document.getElementById("btnRefreshAll");
  const btnExportMonitor = document.getElementById("btnExportMonitor");
  const btnImportMonitor = document.getElementById("btnImportMonitor");
  const btnClearResults = document.getElementById("btnClearResults");
  const fileInputMonitor = document.getElementById("fileInputMonitor");

  const timeRange = document.getElementById("timeRange");
  const rowsPerKeyword = document.getElementById("rowsPerKeyword");
  const searchResults = document.getElementById("searchResults");
  const sortResults = document.getElementById("sortResults");
  const statusFilter = document.getElementById("statusFilter");

  const keywordList = document.getElementById("keywordList");
  const resultsBody = document.getElementById("resultsBody");

  const statKeywords = document.getElementById("statKeywords");
  const statResults = document.getElementById("statResults");
  const statUnread = document.getElementById("statUnread");
  const statAdded = document.getElementById("statAdded");

  const toastEl = document.getElementById("toast");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function uuid(prefix = "id") {
    return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }

  function escapeHtml(s) {
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function normalizeDoi(input) {
    const s = (input || "").trim();
    if (!s) return "";
    return s.replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "").trim();
  }

  function normalizeUrl(url) {
    const s = (url || "").trim();
    if (!s) return "";
    if (/^10\.\d{4,9}\//.test(s)) return "https://doi.org/" + s;
    return s;
  }

  function loadData() {
    try {
      keywords = JSON.parse(localStorage.getItem(KEYWORDS_KEY) || "[]");
      if (!Array.isArray(keywords)) keywords = [];
    } catch {
      keywords = [];
    }

    try {
      results = JSON.parse(localStorage.getItem(RESULTS_KEY) || "[]");
      if (!Array.isArray(results)) results = [];
    } catch {
      results = [];
    }
  }

  function saveKeywords() {
    localStorage.setItem(KEYWORDS_KEY, JSON.stringify(keywords));
  }

  function saveResults() {
    localStorage.setItem(RESULTS_KEY, JSON.stringify(results));
  }

  function parseYear(msg) {
    return String(
      msg?.issued?.["date-parts"]?.[0]?.[0] ||
      msg?.published?.["date-parts"]?.[0]?.[0] ||
      msg?.created?.["date-parts"]?.[0]?.[0] ||
      ""
    );
  }

  function formatAuthors(authorArr) {
    if (!Array.isArray(authorArr)) return "";
    return authorArr.map(a => {
      const family = a.family || "";
      const given = a.given || "";
      return (family + " " + given).trim();
    }).filter(Boolean).join("; ");
  }

  function resultTextBlob(r) {
    return [
      r.title, r.authors, r.year, r.venue, r.doi, r.url,
      (r.matchedKeywords || []).join(" "), r.note || ""
    ].join(" ").toLowerCase();
  }

  function filteredResults() {
    let list = [...results];
    const q = (searchResults.value || "").trim().toLowerCase();
    const sf = statusFilter.value;
    const sort = sortResults.value;

    if (q) list = list.filter(r => resultTextBlob(r).includes(q));

    if (sf === "new") list = list.filter(r => !r.read);
    else if (sf === "read") list = list.filter(r => !!r.read);
    else if (sf === "added") list = list.filter(r => !!r.addedToLibrary);
    else if (sf === "not_added") list = list.filter(r => !r.addedToLibrary);

    if (sort === "fetched_desc") list.sort((a,b) => (b.fetchedAt || 0) - (a.fetchedAt || 0));
    else if (sort === "year_desc") list.sort((a,b) => (parseInt(b.year || "0", 10) || 0) - (parseInt(a.year || "0", 10) || 0));
    else if (sort === "year_asc") list.sort((a,b) => (parseInt(a.year || "0", 10) || 0) - (parseInt(b.year || "0", 10) || 0));
    else if (sort === "title_asc") list.sort((a,b) => (a.title || "").localeCompare((b.title || ""), "en"));

    return list;
  }

  function updateStats() {
    statKeywords.textContent = String(keywords.length);
    statResults.textContent = String(results.length);
    statUnread.textContent = String(results.filter(r => !r.read).length);
    statAdded.textContent = String(results.filter(r => !!r.addedToLibrary).length);
  }

  function renderKeywords() {
    if (!keywords.length) {
      keywordList.innerHTML = `<div class="empty">还没有关键词。先添加几个你想监控的主题。</div>`;
      return;
    }

    keywordList.innerHTML = keywords.map(k => {
      return `
        <div class="keyword-item">
          <div>
            <div class="keyword-title">${escapeHtml(k.text)}</div>
            <div class="keyword-meta">
              ${k.note ? escapeHtml(k.note) + " · " : ""}
              创建于 ${new Date(k.createdAt).toLocaleString()}
              ${k.lastFetchedAt ? ` · 上次刷新 ${new Date(k.lastFetchedAt).toLocaleString()}` : " · 尚未刷新"}
            </div>
          </div>
          <div class="chips">
            <span class="chip">命中结果 <span class="meta">${results.filter(r => (r.matchedKeywords || []).includes(k.text)).length}</span></span>
          </div>
          <div class="row-actions">
            <button class="iconbtn warn" data-kact="refresh" data-id="${k.id}">刷新这个词</button>
            <button class="iconbtn" data-kact="focus" data-id="${k.id}">只看这个词</button>
            <button class="iconbtn danger" data-kact="delete" data-id="${k.id}">删除</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderResults() {
    const list = filteredResults();

    if (!list.length) {
      resultsBody.innerHTML = `
        <tr>
          <td colspan="8" class="empty">
            还没有结果。你可以先添加关键词，然后点“刷新全部关键词”或“刷新这个词”。
          </td>
        </tr>
      `;
      return;
    }

    resultsBody.innerHTML = list.map(r => {
      const doi = normalizeDoi(r.doi);
      const doiUrl = doi ? `https://doi.org/${encodeURIComponent(doi)}` : "";
      const link = normalizeUrl(r.url || doiUrl);

      const kwHtml = (r.matchedKeywords || []).map(k => `<span class="tag">${escapeHtml(k)}</span>`).join("");
      const statusHtml = `
        ${r.read ? `<span class="tag ok">已读</span>` : `<span class="tag warn">未读</span>`}
        ${r.addedToLibrary ? `<span class="tag ok">已加入</span>` : ``}
      `;

      return `
        <tr>
          <td>
            <div class="result-title">${escapeHtml(r.title || "(无标题)")}</div>
            <div class="muted" style="margin-top:6px;line-height:1.45;">
              抓取时间：${new Date(r.fetchedAt).toLocaleString()}
              ${r.updatedAt && r.updatedAt !== r.fetchedAt ? ` · 更新：${new Date(r.updatedAt).toLocaleString()}` : ""}
            </div>
          </td>
          <td>${escapeHtml(r.authors || "")}</td>
          <td>${escapeHtml(r.year || "")}</td>
          <td>${escapeHtml(r.venue || "")}</td>
          <td class="mono">${doi ? `<a href="${doiUrl}" target="_blank" rel="noopener">${escapeHtml(doi)}</a>` : ""}</td>
          <td>${kwHtml}</td>
          <td>${statusHtml}</td>
          <td>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${link ? `<a class="iconbtn" href="${escapeHtml(link)}" target="_blank" rel="noopener">打开原文</a>` : ""}
              <button class="iconbtn ok" data-ract="add" data-id="${r.id}">${r.addedToLibrary ? "再次加入库" : "加入文献库"}</button>
              <button class="iconbtn warn" data-ract="toggle-read" data-id="${r.id}">${r.read ? "标未读" : "标已读"}</button>
              <button class="iconbtn" data-ract="remove" data-id="${r.id}">移除</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function renderAll() {
    updateStats();
    renderKeywords();
    renderResults();
  }

  function addKeyword() {
    const text = (kwText.value || "").trim();
    const note = (kwNote.value || "").trim();

    if (!text) {
      toast("请输入关键词");
      return;
    }

    const exists = keywords.some(k => k.text.toLowerCase() === text.toLowerCase());
    if (exists) {
      toast("该关键词已存在");
      return;
    }

    const now = Date.now();
    keywords.unshift({
      id: uuid("kw"),
      text,
      note,
      createdAt: now,
      updatedAt: now,
      lastFetchedAt: null
    });

    saveKeywords();
    renderAll();
    kwText.value = "";
    kwNote.value = "";
    toast("关键词已添加");
  }

  function deleteKeyword(id) {
    const kw = keywords.find(k => k.id === id);
    if (!kw) return;
    if (!confirm(`确认删除关键词？\n\n${kw.text}`)) return;
    keywords = keywords.filter(k => k.id !== id);
    saveKeywords();
    renderAll();
    toast("关键词已删除");
  }

  function setFocusKeyword(keywordText) {
    searchResults.value = keywordText;
    renderResults();
    toast("已筛选该关键词相关结果");
  }

  async function crossrefSearchKeyword(keywordText) {
    const days = parseInt(timeRange.value, 10) || 30;
    const rows = parseInt(rowsPerKeyword.value, 10) || 20;

    const fromDate = new Date();
    fromDate.setDate(fromDate.getDate() - days);

    const yyyy = fromDate.getFullYear();
    const mm = String(fromDate.getMonth() + 1).padStart(2, "0");
    const dd = String(fromDate.getDate()).padStart(2, "0");
    const dateStr = `${yyyy}-${mm}-${dd}`;

    const url =
      "https://api.crossref.org/works?query=" + encodeURIComponent(keywordText) +
      "&filter=from-pub-date:" + encodeURIComponent(dateStr) +
      "&sort=published&order=desc&rows=" + encodeURIComponent(rows);

    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("Crossref 请求失败");
    const data = await res.json();
    return Array.isArray(data?.message?.items) ? data.message.items : [];
  }

  function upsertMonitorResultFromCrossref(msg, keywordText) {
    const doi = normalizeDoi(msg.DOI || "");
    const title = msg.title?.[0] || "";
    const authors = formatAuthors(msg.author);
    const year = parseYear(msg);
    const venue = msg["container-title"]?.[0] || "";
    const url = normalizeUrl(msg.URL || (doi ? "https://doi.org/" + doi : ""));

    let idx = -1;
    if (doi) {
      idx = results.findIndex(r => normalizeDoi(r.doi) === doi);
    } else if (title) {
      idx = results.findIndex(r => (r.title || "").trim().toLowerCase() === title.trim().toLowerCase());
    }

    const now = Date.now();

    if (idx >= 0) {
      const old = results[idx];
      const mergedKeywords = Array.from(new Set([...(old.matchedKeywords || []), keywordText]));
      results[idx] = {
        ...old,
        title: title || old.title,
        authors: authors || old.authors,
        year: year || old.year,
        venue: venue || old.venue,
        doi: doi || old.doi,
        url: url || old.url,
        matchedKeywords: mergedKeywords,
        updatedAt: now
      };
    } else {
      results.unshift({
        id: uuid("res"),
        title,
        authors,
        year,
        venue,
        doi,
        url,
        matchedKeywords: [keywordText],
        fetchedAt: now,
        updatedAt: now,
        read: false,
        addedToLibrary: false
      });
    }
  }

  async function refreshKeyword(id) {
    const kw = keywords.find(k => k.id === id);
    if (!kw) return;

    const btns = Array.from(document.querySelectorAll(`[data-kact="refresh"][data-id="${id}"]`));
    btns.forEach(b => { b.disabled = true; b.textContent = "刷新中…"; });

    try {
      const items = await crossrefSearchKeyword(kw.text);
      items.forEach(msg => upsertMonitorResultFromCrossref(msg, kw.text));

      kw.lastFetchedAt = Date.now();
      kw.updatedAt = Date.now();

      saveKeywords();
      saveResults();
      renderAll();
      toast(`已刷新：${kw.text}`);
    } catch (e) {
      toast("刷新失败：" + (e?.message || e));
    } finally {
      btns.forEach(b => { b.disabled = false; b.textContent = "刷新这个词"; });
    }
  }

  async function refreshAllKeywords() {
    if (!keywords.length) {
      toast("请先添加关键词");
      return;
    }

    if (refreshingAll) return;
    refreshingAll = true;
    btnRefreshAll.disabled = true;
    btnRefreshAll.textContent = "正在刷新全部…";

    try {
      for (const kw of keywords) {
        const items = await crossrefSearchKeyword(kw.text);
        items.forEach(msg => upsertMonitorResultFromCrossref(msg, kw.text));
        kw.lastFetchedAt = Date.now();
        kw.updatedAt = Date.now();
      }

      saveKeywords();
      saveResults();
      renderAll();
      toast("全部关键词已刷新");
    } catch (e) {
      toast("批量刷新失败：" + (e?.message || e));
    } finally {
      refreshingAll = false;
      btnRefreshAll.disabled = false;
      btnRefreshAll.textContent = "刷新全部关键词";
    }
  }

  function toggleReadResult(id) {
    const idx = results.findIndex(r => r.id === id);
    if (idx < 0) return;
    results[idx].read = !results[idx].read;
    results[idx].updatedAt = Date.now();
    saveResults();
    renderAll();
  }

  function removeResult(id) {
    results = results.filter(r => r.id !== id);
    saveResults();
    renderAll();
    toast("已移除结果");
  }

  function loadLiterature() {
    try {
      const raw = localStorage.getItem(LITERATURE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch {
      return [];
    }
  }

  function saveLiterature(items) {
    localStorage.setItem(LITERATURE_KEY, JSON.stringify(items));
  }

  function addResultToLiterature(id) {
    const r = results.find(x => x.id === id);
    if (!r) return;

    const literature = loadLiterature();
    const doi = normalizeDoi(r.doi);

    if (doi) {
      const exists = literature.some(x => normalizeDoi(x.doi) === doi);
      if (exists) {
        const idx = results.findIndex(x => x.id === id);
        if (idx >= 0) {
          results[idx].addedToLibrary = true;
          results[idx].updatedAt = Date.now();
          saveResults();
          renderAll();
        }
        toast("文献库中已存在相同 DOI");
        return;
      }
    }

    const now = Date.now();
    const tags = Array.from(new Set([...(r.matchedKeywords || []), "monitor"]));

    literature.unshift({
      id: uuid("lit"),
      title: r.title || "",
      authors: r.authors || "",
      year: r.year || "",
      venue: r.venue || "",
      doi: doi || "",
      url: normalizeUrl(r.url || ""),
      tags,
      notes: "From monitor.html",
      type: "paper",
      addedAt: now,
      updatedAt: now
    });

    saveLiterature(literature);

    const idx = results.findIndex(x => x.id === id);
    if (idx >= 0) {
      results[idx].addedToLibrary = true;
      results[idx].updatedAt = Date.now();
      saveResults();
    }

    renderAll();
    toast("已加入 literature.html 文献库");
  }

  function exportMonitorData() {
    const data = {
      keywords,
      results,
      exportedAt: Date.now()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "monitor_backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  function importMonitorData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);

        const inKeywords = Array.isArray(parsed.keywords) ? parsed.keywords : [];
        const inResults = Array.isArray(parsed.results) ? parsed.results : [];

        const kwMap = new Map(keywords.map(k => [k.id, k]));
        inKeywords.forEach(k => {
          if (k && typeof k === "object") {
            kwMap.set(k.id || uuid("kw"), {
              id: k.id || uuid("kw"),
              text: k.text || "",
              note: k.note || "",
              createdAt: typeof k.createdAt === "number" ? k.createdAt : Date.now(),
              updatedAt: typeof k.updatedAt === "number" ? k.updatedAt : Date.now(),
              lastFetchedAt: typeof k.lastFetchedAt === "number" ? k.lastFetchedAt : null
            });
          }
        });

        const resMap = new Map();
        results.forEach(r => {
          const key = normalizeDoi(r.doi) || ("title:" + (r.title || "").trim().toLowerCase());
          resMap.set(key, r);
        });

        inResults.forEach(r => {
          if (!r || typeof r !== "object") return;
          const key = normalizeDoi(r.doi || "") || ("title:" + (r.title || "").trim().toLowerCase());
          const old = resMap.get(key);

          if (old) {
            resMap.set(key, {
              ...old,
              ...r,
              matchedKeywords: Array.from(new Set([...(old.matchedKeywords || []), ...(Array.isArray(r.matchedKeywords) ? r.matchedKeywords : [])]))
            });
          } else {
            resMap.set(key, {
              id: r.id || uuid("res"),
              title: r.title || "",
              authors: r.authors || "",
              year: r.year || "",
              venue: r.venue || "",
              doi: normalizeDoi(r.doi || ""),
              url: normalizeUrl(r.url || ""),
              matchedKeywords: Array.isArray(r.matchedKeywords) ? r.matchedKeywords : [],
              fetchedAt: typeof r.fetchedAt === "number" ? r.fetchedAt : Date.now(),
              updatedAt: typeof r.updatedAt === "number" ? r.updatedAt : Date.now(),
              read: !!r.read,
              addedToLibrary: !!r.addedToLibrary
            });
          }
        });

        keywords = Array.from(kwMap.values());
        results = Array.from(resMap.values());

        saveKeywords();
        saveResults();
        renderAll();
        toast("监控数据已导入");
      } catch (e) {
        alert("导入失败：" + (e?.message || e));
      }
    };
    reader.readAsText(file);
  }

  function clearResults() {
    if (!confirm("确认清空所有监控结果？关键词不会被删除。")) return;
    results = [];
    saveResults();
    renderAll();
    toast("结果已清空");
  }

  // Events
  btnAddKeyword.addEventListener("click", addKeyword);
  kwText.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addKeyword();
  });

  btnRefreshAll.addEventListener("click", refreshAllKeywords);
  btnExportMonitor.addEventListener("click", exportMonitorData);
  btnImportMonitor.addEventListener("click", () => fileInputMonitor.click());
  fileInputMonitor.addEventListener("change", () => {
    const f = fileInputMonitor.files?.[0];
    if (f) importMonitorData(f);
    fileInputMonitor.value = "";
  });
  btnClearResults.addEventListener("click", clearResults);

  [searchResults, sortResults, statusFilter].forEach(el => {
    el.addEventListener("input", renderResults);
    el.addEventListener("change", renderResults);
  });

  keywordList.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-kact]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const act = btn.getAttribute("data-kact");

    if (act === "refresh") refreshKeyword(id);
    else if (act === "delete") deleteKeyword(id);
    else if (act === "focus") {
      const kw = keywords.find(k => k.id === id);
      if (kw) setFocusKeyword(kw.text);
    }
  });

  resultsBody.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-ract]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const act = btn.getAttribute("data-ract");

    if (act === "add") addResultToLiterature(id);
    else if (act === "toggle-read") toggleReadResult(id);
    else if (act === "remove") removeResult(id);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "k" || e.key === "K") {
      e.preventDefault();
      kwText.focus();
    }
  });

  // Init
  loadData();
  renderAll();
})();
</script>
</body>
