<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperLens 侧边面板</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>PaperLens</h1>
      <div class="actions">
        <button id="refreshBtn">刷新</button>
        <button id="copyBtn">复制为 Markdown</button>
      </div>
    </header>

    <section id="meta" class="meta"></section>
    <section id="cards" class="cards"></section>

    <template id="cardTpl">
      <article class="card">
        <h2></h2>
        <p class="content"></p>
        <details>
          <summary>证据片段</summary>
          <ul class="evidence"></ul>
        </details>
      </article>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
