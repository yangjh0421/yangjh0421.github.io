<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yangjh0421 | 个人主页</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#2563eb;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.6;
    }
    a{ color:inherit; text-decoration:none; }
    .container{ max-width:980px; margin:0 auto; padding:0 20px; }

    /* 顶部导航 */
    header{
      position:sticky; top:0;
      background:rgba(246,247,251,0.9);
      backdrop-filter: blur(8px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 0;
    }
    .brand{ font-weight:700; letter-spacing:0.2px; }
    .navlinks{
      display:flex; gap:16px; flex-wrap:wrap;
      font-size:14px; color:var(--muted);
    }
    .navlinks a:hover{ color:var(--primary); }

    /* 主体区块 */
    main{ padding:28px 0 60px; }
    .hero{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:26px;
    }
    .hero h1{ margin:0 0 6px; font-size:28px; }
    .hero p{ margin:0; color:var(--muted); }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:18px;
      margin-top:18px;
    }
    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
    }

    section.card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:20px;
    }
    section.card h2{
      margin:0 0 10px;
      font-size:18px;
    }
    .muted{ color:var(--muted); }

    /* 项目列表占位 */
    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      border:1px dashed var(--line);
      border-radius:12px;
      padding:12px;
    }
    .item .title{ font-weight:700; }
    .item .desc{ color:var(--muted); font-size:14px; margin-top:4px; }

    /* 页脚 */
    footer{
      border-top:1px solid var(--line);
      padding:18px 0;
      color:var(--muted);
      font-size:14px;
    }
  </style>
</head>

<body>
  <!-- 顶部导航 -->
  <header>
    <div class="container nav">
      <div class="brand">yangjh0421</div>
      <nav class="navlinks">
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="#notes">笔记</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 头图/开场 -->
    <div class="hero">
      <h1>你好，我是 <span style="color:var(--primary)">yangjh0421</span></h1>
      <p>
    </div>

    <div class="grid">
      <!-- 左侧：主要内容 -->
      <div>
        <section id="about" class="card">
         <h2>链接</h2>
<p class="muted">
  <a href="link.html" 
     style="text-decoration:none; font-weight:600; color:var(--primary);">
     📚 文献
  </a>
</p>
        </section>

        <section id="projects" class="card" style="margin-top:18px;">
          <h2>收藏文献</h2>
          
            <div class="item">
              <div class="title"文献</div>
              <div class="desc">（占位）可以放 GitHub 链接 / Demo 链接。</div>
            </div>
          </div>
        </section>

          </ul>
        </section>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> yangjh0421 · Built with GitHub Pages
    </div>
  </footer>

  <script>
    // 自动更新年份
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
