<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Literature Library</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --panel2:#fafbfc;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;

      --brand:#2563eb;
      --brand-soft:#eff6ff;

      --danger:#dc2626;
      --danger-soft:#fef2f2;

      --ok:#059669;
      --ok-soft:#ecfdf5;

      --warn:#d97706;
      --warn-soft:#fffbeb;

      --shadow:0 8px 24px rgba(15,23,42,.06);
      --radius:14px;

      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:var(--sans);
      background:
        radial-gradient(900px 420px at 20% -10%, rgba(37,99,235,.05), transparent 60%),
        radial-gradient(700px 360px at 100% 0%, rgba(14,165,233,.04), transparent 55%),
        var(--bg);
      color:var(--text);
    }

    a{color:var(--brand); text-decoration:none}
    a:hover{text-decoration:underline}

    header{
      padding:28px 18px 18px;
      max-width:1240px;
      margin:0 auto;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:flex-end;
      justify-content:space-between;
    }

    .title h1{
      margin:0;
      font-size:28px;
      letter-spacing:.2px;
      color:#111827;
    }

    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      box-shadow:var(--shadow);
      font-size:13px;
      user-select:none;
      transition:.18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:#cbd5e1;
      background:#f9fafb;
    }

    .btn.primary{
      background:var(--brand);
      color:#fff;
      border-color:var(--brand);
    }
    .btn.primary:hover{background:#1d4ed8}

    .btn.danger{
      color:var(--danger);
      border-color:#fecaca;
      background:#fff;
    }

    .btn.ok{
      color:var(--ok);
      border-color:#bbf7d0;
      background:#fff;
    }

    .btn.warn{
      color:var(--warn);
      border-color:#fde68a;
      background:#fff;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    main{
      max-width:1240px;
      margin:0 auto;
      padding:0 18px 40px;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .quickadd{
      padding:16px;
      display:grid;
      grid-template-columns:1.6fr .9fr 1fr;
      gap:10px;
      border-bottom:1px solid var(--line);
      background:var(--panel2);
    }

    @media (max-width: 900px){
      .quickadd{grid-template-columns:1fr;}
    }

    .quickadd .hint{
      grid-column:1/-1;
      margin:2px 0 0;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .quickadd .right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:end;
    }

    .filters{
      padding:14px 16px;
      display:grid;
      grid-template-columns:1.4fr .85fr .8fr .85fr .75fr;
      gap:10px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    @media (max-width: 980px){
      .filters{grid-template-columns:1fr 1fr;}
    }

    @media (max-width: 560px){
      .filters{grid-template-columns:1fr;}
    }

    input, select, textarea{
      width:100%;
      background:#fff;
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      outline:none;
      transition:.15s ease;
    }

    input:focus, select:focus, textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }

    input::placeholder, textarea::placeholder{
      color:#9ca3af;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .table-wrap{overflow:auto}

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1160px;
    }

    th, td{
      padding:12px;
      border-bottom:1px solid #eef2f7;
      vertical-align:top;
      font-size:13px;
    }

    th{
      position:sticky;
      top:0;
      background:#f8fafc;
      color:#374151;
      text-align:left;
      z-index:2;
      white-space:nowrap;
    }

    tr:hover td{
      background:#f9fbff;
    }

    .muted{color:var(--muted)}
    .mono{font-family:var(--mono); font-size:12px}

    .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid #dbeafe;
      background:#eff6ff;
      color:#1d4ed8;
      margin:2px 6px 2px 0;
      font-size:12px;
      white-space:nowrap;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .iconbtn{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      cursor:pointer;
      font-size:12px;
      user-select:none;
      transition:.15s ease;
    }

    .iconbtn:hover{
      border-color:#cbd5e1;
      background:#f9fafb;
    }

    .iconbtn.danger{
      border-color:#fecaca;
      color:var(--danger);
    }

    .iconbtn.ok{
      border-color:#bbf7d0;
      color:var(--ok);
    }

    .iconbtn.warn{
      border-color:#fde68a;
      color:var(--warn);
    }

    .favbtn{
      min-width:40px;
      font-size:18px;
      line-height:1;
      padding:7px 10px;
    }

    .foot{
      padding:12px 16px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
      background:var(--panel2);
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.22);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }

    .modal.open{display:flex}

    .card{
      width:min(980px, 100%);
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 24px 80px rgba(15,23,42,.12);
      overflow:hidden;
    }

    .card header{
      padding:16px 16px 10px;
      max-width:none;
      margin:0;
      align-items:center;
      display:flex;
      gap:12px;
      justify-content:space-between;
      flex-wrap:wrap;
      border-bottom:1px solid #f1f5f9;
    }

    .card header h2{
      margin:0;
      font-size:16px;
      color:#111827;
    }

    .card header .sub{
      margin:4px 0 0;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .card .body{
      padding:14px 16px 16px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    @media (max-width: 760px){
      .card .body{grid-template-columns:1fr}
    }

    .span2{grid-column:1/-1}
    .row{display:flex; flex-direction:column; gap:6px;}

    label{
      font-size:12px;
      color:#4b5563;
    }

    .card .footer{
      padding:12px 16px 16px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid var(--line);
      background:#fafbfc;
    }

    .kbd{
      font-family:var(--mono);
      border:1px solid #d1d5db;
      padding:2px 6px;
      border-radius:8px;
      background:#fff;
      color:#374151;
    }

    .warnbox{
      margin-top:14px;
      padding:14px 16px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      color:var(--text);
      font-size:12px;
      line-height:1.7;
      max-width:1240px;
      margin-left:auto;
      margin-right:auto;
      box-shadow:var(--shadow);
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      background:#111827;
      border:1px solid #1f2937;
      padding:10px 12px;
      border-radius:14px;
      color:#fff;
      font-size:13px;
      box-shadow:0 16px 50px rgba(0,0,0,.18);
      display:none;
      max-width:min(900px, calc(100vw - 24px));
      line-height:1.4;
      z-index:99;
    }

    .toast.show{display:block}
  </style>
</head>
<body>

<header>
  <div class="title">
    <h1>Literature Library</h1>
    <p>本地保存，可导出 JSON 备份，并支持通过 DOI / 题目自动补全文献信息。</p>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="btnAdd">＋ 新增文献</button>
    <button class="btn" id="btnExport">导出 JSON</button>
    <button class="btn" id="btnImport">导入 JSON</button>
    <button class="btn danger" id="btnClear">清空全部</button>
  </div>
</header>

<main>
  <div class="panel">

    <div class="quickadd">
      <div class="row">
        <label>快速添加：输入 DOI 或题目</label>
        <input id="quickQuery" placeholder="例如：10.1038/s41557-021-00720-5 或 Transient micellar environments ..." />
      </div>

      <div class="row">
        <label>给新条目预设标签（可选，逗号分隔）</label>
        <input id="quickTags" placeholder="DCL, micelle, replication" />
      </div>

      <div class="right">
        <button class="btn ok" id="btnQuickAdd">自动抓取</button>
      </div>

      <div class="hint">
        说明：题目搜索默认取最相关的 1 条结果。快捷键：<span class="kbd">/</span> 聚焦搜索；<span class="kbd">N</span> 新增文献。
      </div>
    </div>

    <div class="filters">
      <input id="q" placeholder="搜索：标题 / 作者 / DOI / 期刊 / 标签 / 备注 …（本地模糊匹配）" />

      <select id="tagFilter">
        <option value="">标签筛选：全部</option>
      </select>

      <select id="favoriteFilter">
        <option value="">收藏：全部</option>
        <option value="1">仅收藏</option>
      </select>

      <select id="sortBy">
        <option value="added_desc">排序：最近添加</option>
        <option value="added_asc">排序：最早添加</option>
        <option value="fav_desc">排序：收藏优先</option>
        <option value="year_desc">排序：年份（新→旧）</option>
        <option value="year_asc">排序：年份（旧→新）</option>
        <option value="title_asc">排序：标题（A→Z）</option>
        <option value="title_desc">排序：标题（Z→A）</option>
      </select>

      <select id="typeFilter">
        <option value="">类型：全部</option>
        <option value="paper">论文</option>
        <option value="review">综述</option>
        <option value="book">书籍</option>
        <option value="preprint">预印本</option>
        <option value="thesis">学位论文</option>
        <option value="other">其他</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:6%">收藏</th>
            <th style="width:30%">标题</th>
            <th style="width:18%">作者</th>
            <th style="width:7%">年</th>
            <th style="width:13%">期刊/会议</th>
            <th style="width:12%">DOI</th>
            <th style="width:6%">链接</th>
            <th style="width:14%">标签</th>
            <th style="width:16%">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="foot">
      <div>共 <span id="count">0</span> 条</div>
      <div class="muted">提示：每条文献支持补全信息（Crossref）与 RIS 下载</div>
    </div>
  </div>

  <div class="warnbox">
    <b>书签脚本（从外部网页带入标题 + URL）：</b><br />
    把下面这段拖到书签栏，或新建书签后把“网址 / URL”粘进去。你在任何网页点它，会打开本页并弹出新增窗口（自动带入标题 / URL）：<br />
    <span class="mono" id="bookmarkletText"></span>
  </div>
</main>

<div class="modal" id="modal">
  <div class="card" role="dialog" aria-modal="true">
    <header>
      <div>
        <h2 id="modalTitle">新增文献</h2>
        <div class="sub">可先填 DOI 或标题，再点“补全信息”。标签用逗号分隔。</div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn warn" id="btnFetch">补全信息</button>
        <button class="btn" id="btnClose">关闭</button>
      </div>
    </header>

    <div class="body">
      <div class="row span2">
        <label>标题</label>
        <input id="f_title" placeholder="例如：Transient micellar environments enable..." />
      </div>

      <div class="row">
        <label>作者（建议用 ; 分隔）</label>
        <input id="f_authors" placeholder="例如：Wang X; Li Y; Smith J" />
      </div>

      <div class="row">
        <label>年份</label>
        <input id="f_year" placeholder="例如：2024" inputmode="numeric" />
      </div>

      <div class="row">
        <label>期刊/会议</label>
        <input id="f_venue" placeholder="例如：Nat. Rev. Chem." />
      </div>

      <div class="row">
        <label>类型</label>
        <select id="f_type">
          <option value="paper">论文</option>
          <option value="review">综述</option>
          <option value="book">书籍</option>
          <option value="preprint">预印本</option>
          <option value="thesis">学位论文</option>
          <option value="other">其他</option>
        </select>
      </div>

      <div class="row">
        <label>DOI</label>
        <input id="f_doi" placeholder="10.xxxx/xxxxxx 或 https://doi.org/..." />
      </div>

      <div class="row span2">
        <label>URL（原文 / 网页）</label>
        <input id="f_url" placeholder="https://..." />
      </div>

      <div class="row span2">
        <label>标签（逗号分隔）</label>
        <input id="f_tags" placeholder="DCL, micelle, replication, chirality" />
      </div>

      <div class="row span2">
        <label>备注</label>
        <textarea id="f_notes" placeholder="你为什么收藏它？关键图 / 关键结论？"></textarea>
      </div>
    </div>

    <div class="footer">
      <button class="btn danger" id="btnDelete" style="display:none;">删除</button>
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn ok" id="btnSave">保存</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
(() => {
  const STORAGE_KEY = "literature_items_v3";

  /** @type {Array<LitItem>} */
  let items = [];

  /** @type {string|null} */
  let editingId = null;

  /** @typedef {{
   *  id: string,
   *  title: string,
   *  authors: string,
   *  year: string,
   *  venue: string,
   *  doi: string,
   *  url: string,
   *  tags: string[],
   *  notes: string,
   *  type: string,
   *  favorite: boolean,
   *  addedAt: number,
   *  updatedAt: number
   * }} LitItem */

  const tbody = document.getElementById("tbody");
  const countEl = document.getElementById("count");
  const qEl = document.getElementById("q");
  const tagFilterEl = document.getElementById("tagFilter");
  const favoriteFilterEl = document.getElementById("favoriteFilter");
  const sortByEl = document.getElementById("sortBy");
  const typeFilterEl = document.getElementById("typeFilter");

  const quickQueryEl = document.getElementById("quickQuery");
  const quickTagsEl = document.getElementById("quickTags");
  const btnQuickAdd = document.getElementById("btnQuickAdd");

  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const btnAdd = document.getElementById("btnAdd");
  const btnClose = document.getElementById("btnClose");
  const btnCancel = document.getElementById("btnCancel");
  const btnSave = document.getElementById("btnSave");
  const btnDelete = document.getElementById("btnDelete");
  const btnExport = document.getElementById("btnExport");
  const btnImport = document.getElementById("btnImport");
  const btnClear = document.getElementById("btnClear");
  const fileInput = document.getElementById("fileInput");
  const btnFetch = document.getElementById("btnFetch");
  const toastEl = document.getElementById("toast");

  const f_title = document.getElementById("f_title");
  const f_authors = document.getElementById("f_authors");
  const f_year = document.getElementById("f_year");
  const f_venue = document.getElementById("f_venue");
  const f_doi = document.getElementById("f_doi");
  const f_url = document.getElementById("f_url");
  const f_tags = document.getElementById("f_tags");
  const f_notes = document.getElementById("f_notes");
  const f_type = document.getElementById("f_type");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function uuid() {
    return "lit_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }

  function escapeHtml(s) {
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function normalizeDoi(input) {
    const s = (input || "").trim();
    if (!s) return "";
    return s.replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "").trim();
  }

  function doiToUrl(doi) {
    const d = normalizeDoi(doi);
    return d ? ("https://doi.org/" + d) : "";
  }

  function normalizeUrl(url) {
    const s = (url || "").trim();
    if (!s) return "";
    if (/^10\.\d{4,9}\//.test(s)) return "https://doi.org/" + s;
    return s;
  }

  function parseTags(s) {
    return (s || "")
      .split(",")
      .map(t => t.trim())
      .filter(Boolean);
  }

  function saveStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function loadStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(items)) items = [];
      items = items.map(x => ({
        id: x.id || uuid(),
        title: x.title || "",
        authors: x.authors || "",
        year: x.year || "",
        venue: x.venue || "",
        doi: normalizeDoi(x.doi || ""),
        url: normalizeUrl(x.url || ""),
        tags: Array.isArray(x.tags) ? x.tags : parseTags(x.tags || ""),
        notes: x.notes || "",
        type: x.type || "paper",
        favorite: !!x.favorite,
        addedAt: typeof x.addedAt === "number" ? x.addedAt : Date.now(),
        updatedAt: typeof x.updatedAt === "number" ? x.updatedAt : Date.now()
      }));
    } catch {
      items = [];
    }
  }

  function allTags() {
    const set = new Set();
    items.forEach(it => (it.tags || []).forEach(t => set.add(t)));
    return Array.from(set).sort((a,b) => a.localeCompare(b, "zh-Hans-CN"));
  }

  function refreshTagFilter() {
    const current = tagFilterEl.value;
    const tags = allTags();
    tagFilterEl.innerHTML = `<option value="">标签筛选：全部</option>` + tags.map(t =>
      `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`
    ).join("");
    if (tags.includes(current)) tagFilterEl.value = current;
  }

  function matchText(it, q) {
    const blob = [
      it.title, it.authors, it.year, it.venue, it.doi, it.url,
      (it.tags || []).join(" "), it.notes, it.type
    ].join(" ").toLowerCase();
    return blob.includes(q);
  }

  function sortItems(list) {
    const mode = sortByEl.value;
    const copy = [...list];
    const byTitle = (a,b) => (a.title || "").localeCompare((b.title || ""), "en");
    const byYear = (a,b) => (parseInt(a.year || "0", 10) || 0) - (parseInt(b.year || "0", 10) || 0);

    if (mode === "added_desc") copy.sort((a,b) => b.addedAt - a.addedAt);
    else if (mode === "added_asc") copy.sort((a,b) => a.addedAt - b.addedAt);
    else if (mode === "fav_desc") copy.sort((a,b) => (Number(!!b.favorite) - Number(!!a.favorite)) || (b.addedAt - a.addedAt));
    else if (mode === "year_desc") copy.sort((a,b) => byYear(b,a));
    else if (mode === "year_asc") copy.sort((a,b) => byYear(a,b));
    else if (mode === "title_asc") copy.sort((a,b) => byTitle(a,b));
    else if (mode === "title_desc") copy.sort((a,b) => byTitle(b,a));
    return copy;
  }

  function filteredItems() {
    const q = (qEl.value || "").trim().toLowerCase();
    const tag = tagFilterEl.value;
    const fav = favoriteFilterEl.value;
    const type = typeFilterEl.value;

    let list = items;
    if (q) list = list.filter(it => matchText(it, q));
    if (tag) list = list.filter(it => (it.tags || []).includes(tag));
    if (fav === "1") list = list.filter(it => !!it.favorite);
    if (type) list = list.filter(it => (it.type || "") === type);
    return sortItems(list);
  }

  function typeFromCrossref(msg) {
    const t = (msg && msg.type) ? String(msg.type) : "";
    if (t.includes("journal-article") || t.includes("proceedings-article")) return "paper";
    if (t.includes("book") || t.includes("book-chapter") || t.includes("monograph")) return "book";
    if (t.includes("dissertation") || t.includes("thesis")) return "thesis";
    if (t.includes("posted-content")) return "preprint";
    if (msg && (msg["container-title"] && msg["container-title"][0])) return "paper";
    return "other";
  }

  function formatAuthorsFromCrossref(authorArr) {
    if (!Array.isArray(authorArr) || authorArr.length === 0) return "";
    return authorArr.map(a => {
      const family = a.family || "";
      const given = a.given || "";
      const name = (family + " " + given).trim();
      return name || "";
    }).filter(Boolean).join("; ");
  }

  function yearFromCrossref(msg) {
    const y = msg?.issued?.["date-parts"]?.[0]?.[0];
    if (y) return String(y);
    const y2 = msg?.published?.["date-parts"]?.[0]?.[0];
    if (y2) return String(y2);
    const y3 = msg?.created?.["date-parts"]?.[0]?.[0];
    if (y3) return String(y3);
    return "";
  }

  async function crossrefFetchByDOI(doi) {
    const d = normalizeDoi(doi);
    if (!d) throw new Error("DOI 为空");
    const url = "https://api.crossref.org/works/" + encodeURIComponent(d);
    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("Crossref 请求失败（DOI）");
    const data = await res.json();
    return data.message;
  }

  async function crossrefSearchByTitle(title) {
    const q = (title || "").trim();
    if (!q) throw new Error("标题为空");
    const url = "https://api.crossref.org/works?query.title=" + encodeURIComponent(q) + "&rows=1";
    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("Crossref 请求失败（标题搜索）");
    const data = await res.json();
    return data.message?.items?.[0] || null;
  }

  function applyCrossrefToForm(msg) {
    if (!msg) return;

    const title = msg.title?.[0] || "";
    const venue = msg["container-title"]?.[0] || "";
    const doi = msg.DOI || "";
    const year = yearFromCrossref(msg);
    const authors = formatAuthorsFromCrossref(msg.author);
    const url = msg.URL || doiToUrl(doi) || "";

    if (title) f_title.value = title;
    if (authors) f_authors.value = authors;
    if (year) f_year.value = year;
    if (venue) f_venue.value = venue;
    if (doi) f_doi.value = doi;
    if (url) f_url.value = url;

    const t = typeFromCrossref(msg);
    if (t) f_type.value = t;
  }

  function applyCrossrefToItem(it, msg) {
    if (!msg) return it;
    const title = msg.title?.[0] || it.title || "";
    const venue = msg["container-title"]?.[0] || it.venue || "";
    const doi = msg.DOI || it.doi || "";
    const year = yearFromCrossref(msg) || it.year || "";
    const authors = formatAuthorsFromCrossref(msg.author) || it.authors || "";
    const url = msg.URL || it.url || doiToUrl(doi) || "";
    const type = typeFromCrossref(msg) || it.type || "paper";

    return {
      ...it,
      title,
      authors,
      year,
      venue,
      doi: normalizeDoi(doi),
      url: normalizeUrl(url),
      type
    };
  }

  async function fetchFromCrossrefForForm() {
    const doiInput = normalizeDoi(f_doi.value);
    const titleInput = (f_title.value || "").trim();

    btnFetch.disabled = true;
    btnFetch.textContent = "正在补全…";

    try {
      let msg = null;
      if (doiInput) {
        msg = await crossrefFetchByDOI(doiInput);
      } else if (titleInput) {
        msg = await crossrefSearchByTitle(titleInput);
      } else {
        toast("请先填写 DOI 或标题");
        return;
      }

      if (!msg) {
        toast("未找到文献");
        return;
      }

      applyCrossrefToForm(msg);
      toast("已补全元数据");
    } catch (e) {
      toast("补全失败：" + (e?.message || e));
    } finally {
      btnFetch.disabled = false;
      btnFetch.textContent = "补全信息";
    }
  }

  function openModal(mode, item) {
    modal.classList.add("open");
    document.body.style.overflow = "hidden";

    if (mode === "new") {
      editingId = null;
      modalTitle.textContent = "新增文献";
      btnDelete.style.display = "none";

      f_title.value = item?.title || "";
      f_authors.value = item?.authors || "";
      f_year.value = item?.year || "";
      f_venue.value = item?.venue || "";
      f_doi.value = item?.doi || "";
      f_url.value = item?.url || "";
      f_tags.value = (item?.tags || []).join(", ");
      f_notes.value = item?.notes || "";
      f_type.value = item?.type || "paper";
    } else {
      editingId = item.id;
      modalTitle.textContent = "编辑文献";
      btnDelete.style.display = "inline-block";

      f_title.value = item.title || "";
      f_authors.value = item.authors || "";
      f_year.value = item.year || "";
      f_venue.value = item.venue || "";
      f_doi.value = item.doi || "";
      f_url.value = item.url || "";
      f_tags.value = (item.tags || []).join(", ");
      f_notes.value = item.notes || "";
      f_type.value = item.type || "paper";
    }

    setTimeout(() => f_title.focus(), 0);
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  }

  function getFormItem() {
    const doi = normalizeDoi(f_doi.value);
    const url = normalizeUrl(f_url.value);
    return {
      title: (f_title.value || "").trim(),
      authors: (f_authors.value || "").trim(),
      year: (f_year.value || "").trim(),
      venue: (f_venue.value || "").trim(),
      doi,
      url,
      tags: parseTags(f_tags.value),
      notes: (f_notes.value || "").trim(),
      type: f_type.value || "paper",
    };
  }

  function upsert() {
    const data = getFormItem();
    const now = Date.now();

    if (!data.title && !data.doi && !data.url) {
      toast("标题 / DOI / URL 至少填一个");
      return;
    }

    if (!editingId) {
      const it = {
        id: uuid(),
        ...data,
        favorite: false,
        addedAt: now,
        updatedAt: now
      };
      items.unshift(it);
    } else {
      const idx = items.findIndex(x => x.id === editingId);
      if (idx >= 0) {
        items[idx] = {
          ...items[idx],
          ...data,
          updatedAt: now
        };
      }
    }

    saveStorage();
    closeModal();
    render();
    toast("已保存");
  }

  function removeItem(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    if (!confirm(`确认删除这条记录？\n\n${it.title || "(无标题)"}`)) return;
    items = items.filter(x => x.id !== id);
    saveStorage();
    render();
    toast("已删除");
  }

  function toggleFavorite(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx < 0) return;
    items[idx].favorite = !items[idx].favorite;
    items[idx].updatedAt = Date.now();
    saveStorage();
    render();
    toast(items[idx].favorite ? "已加入收藏" : "已取消收藏");
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify(items, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "literature_backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  function importJsonFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("JSON 顶层必须是数组");

        const incoming = parsed
          .filter(x => x && typeof x === "object")
          .map(x => ({
            id: x.id || uuid(),
            title: x.title || "",
            authors: x.authors || "",
            year: x.year || "",
            venue: x.venue || "",
            doi: normalizeDoi(x.doi || ""),
            url: normalizeUrl(x.url || ""),
            tags: Array.isArray(x.tags) ? x.tags : parseTags(x.tags || ""),
            notes: x.notes || "",
            type: x.type || "paper",
            favorite: !!x.favorite,
            addedAt: typeof x.addedAt === "number" ? x.addedAt : Date.now(),
            updatedAt: typeof x.updatedAt === "number" ? x.updatedAt : (typeof x.addedAt === "number" ? x.addedAt : Date.now())
          }));

        const map = new Map(items.map(x => [x.id, x]));
        incoming.forEach(x => map.set(x.id, x));
        items = Array.from(map.values()).sort((a,b) => b.addedAt - a.addedAt);

        saveStorage();
        render();
        toast(`导入完成：共 ${items.length} 条`);
      } catch (e) {
        alert("导入失败：" + (e?.message || e));
      }
    };
    reader.readAsText(file);
  }

  function clearAll() {
    if (!confirm("确认清空全部文献？此操作不可撤销（除非你有 JSON 备份）。")) return;
    items = [];
    saveStorage();
    render();
    toast("已清空");
  }

  function risTypeForItem(it) {
    const t = (it.type || "").toLowerCase();
    if (t === "book") return "BOOK";
    if (t === "thesis") return "THES";
    if (t === "review") return "JOUR";
    if (t === "preprint") return "GEN";
    return "JOUR";
  }

  function buildRIS(it) {
    const lines = [];
    lines.push(`TY  - ${risTypeForItem(it)}`);

    if (it.title) lines.push(`TI  - ${it.title}`);

    const authors = (it.authors || "")
      .split(";")
      .map(a => a.trim())
      .filter(Boolean);
    authors.forEach(a => lines.push(`AU  - ${a}`));

    if (it.year) lines.push(`PY  - ${it.year}`);
    if (it.venue) lines.push(`JO  - ${it.venue}`);

    const doi = normalizeDoi(it.doi);
    if (doi) lines.push(`DO  - ${doi}`);

    const url = normalizeUrl(it.url) || doiToUrl(doi);
    if (url) lines.push(`UR  - ${url}`);

    const tags = (it.tags || []).filter(Boolean);
    tags.forEach(t => lines.push(`KW  - ${t}`));

    if (it.notes) lines.push(`N1  - ${it.notes}`);

    lines.push("ER  -");
    return lines.join("\n") + "\n";
  }

  function downloadRIS(it) {
    const safeTitle = (it.title || "reference").replace(/[\\\/:*?"<>|]+/g, "_").slice(0, 120);
    const blob = new Blob([buildRIS(it)], {type:"application/x-research-info-systems"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${safeTitle}.ris`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    toast("RIS 已下载");
  }

  async function refreshItemFromCrossref(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx < 0) return;
    const it = items[idx];

    const doi = normalizeDoi(it.doi);
    const title = (it.title || "").trim();

    try {
      let msg = null;
      if (doi) msg = await crossrefFetchByDOI(doi);
      else if (title) msg = await crossrefSearchByTitle(title);
      else {
        toast("此条目没有 DOI / 标题，无法补全");
        return;
      }

      if (!msg) {
        toast("未找到文献");
        return;
      }

      items[idx] = {
        ...applyCrossrefToItem(it, msg),
        updatedAt: Date.now()
      };

      saveStorage();
      render();
      toast("已刷新并补全");
    } catch (e) {
      toast("刷新失败：" + (e?.message || e));
    }
  }

  async function quickAddFromQuery() {
    const query = (quickQueryEl.value || "").trim();
    const presetTags = parseTags(quickTagsEl.value);

    if (!query) {
      toast("请输入 DOI 或题目");
      return;
    }

    btnQuickAdd.disabled = true;
    btnQuickAdd.textContent = "正在抓取…";

    try {
      const asDoi = /^10\.\d{4,9}\//.test(normalizeDoi(query)) || /doi\.org\/10\.\d{4,9}\//i.test(query);
      let msg = null;

      if (asDoi) msg = await crossrefFetchByDOI(query);
      else msg = await crossrefSearchByTitle(query);

      if (!msg) {
        toast("未找到文献");
        return;
      }

      const now = Date.now();
      const newItem = {
        id: uuid(),
        title: (msg.title?.[0] || query).trim(),
        authors: formatAuthorsFromCrossref(msg.author),
        year: yearFromCrossref(msg),
        venue: msg["container-title"]?.[0] || "",
        doi: normalizeDoi(msg.DOI || (asDoi ? normalizeDoi(query) : "")),
        url: normalizeUrl(msg.URL || doiToUrl(msg.DOI || "")),
        tags: presetTags,
        notes: "",
        type: typeFromCrossref(msg),
        favorite: false,
        addedAt: now,
        updatedAt: now
      };

      const doiKey = normalizeDoi(newItem.doi);
      if (doiKey) {
        const exists = items.some(x => normalizeDoi(x.doi) === doiKey);
        if (exists) {
          toast("已存在相同 DOI 的条目");
          return;
        }
      }

      items.unshift(newItem);
      saveStorage();
      render();
      toast("已新增");
      quickQueryEl.value = "";
    } catch (e) {
      toast("新增失败：" + (e?.message || e));
    } finally {
      btnQuickAdd.disabled = false;
      btnQuickAdd.textContent = "自动抓取";
    }
  }

  function render() {
    refreshTagFilter();
    const list = filteredItems();
    countEl.textContent = String(list.length);

    tbody.innerHTML = list.map(it => {
      const doi = normalizeDoi(it.doi);
      const doiLink = doi ? `https://doi.org/${encodeURIComponent(doi)}` : "";
      const url = normalizeUrl(it.url || (doi ? doiLink : ""));
      const tagsHtml = (it.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

      return `
        <tr>
          <td>
            <button class="iconbtn favbtn" data-act="fav" data-id="${it.id}" title="收藏 / 取消收藏">
              ${it.favorite ? "★" : "☆"}
            </button>
          </td>
          <td>
            <div style="font-weight:600; line-height:1.45; color:#111827;">${escapeHtml(it.title || "(无标题)")}</div>
            <div class="muted" style="margin-top:6px; line-height:1.45;">
              ${it.notes ? escapeHtml(it.notes).slice(0, 140) + (it.notes.length > 140 ? "…" : "") : ""}
            </div>
            <div class="muted mono" style="margin-top:6px;">
              added: ${new Date(it.addedAt).toLocaleString()}
              ${it.updatedAt && it.updatedAt !== it.addedAt ? ` · updated: ${new Date(it.updatedAt).toLocaleString()}` : ""}
            </div>
          </td>
          <td>${escapeHtml(it.authors || "")}</td>
          <td>${escapeHtml(it.year || "")}</td>
          <td>
            ${escapeHtml(it.venue || "")}
            <div class="muted" style="margin-top:6px;">${escapeHtml(it.type || "")}</div>
          </td>
          <td class="mono">
            ${doi ? `<a href="${doiLink}" target="_blank" rel="noopener">${escapeHtml(doi)}</a>` : ""}
          </td>
          <td>
            ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">查看</a>` : ""}
          </td>
          <td>${tagsHtml}</td>
          <td>
            <div class="actions">
              <button class="iconbtn ok" data-act="edit" data-id="${it.id}">编辑</button>
              <button class="iconbtn warn" data-act="refresh" data-id="${it.id}">补全</button>
              <button class="iconbtn" data-act="ris" data-id="${it.id}">导出 RIS</button>
              <button class="iconbtn danger" data-act="del" data-id="${it.id}">删除</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");

    if (!tbody.innerHTML) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" style="padding:18px;">
            <div style="font-weight:600; color:#111827;">暂无数据</div>
            <div class="muted" style="margin-top:6px; line-height:1.6;">
              你可以：① 上方用 DOI / 题目快速抓取新增；② 点右上角新增文献；③ 用书签脚本从外部网页带入标题 + URL。
            </div>
          </td>
        </tr>
      `;
    }
  }

  function buildBookmarklet() {
    const target = new URL(location.href);
    target.search = "";
    target.hash = "";
    const js =
      "javascript:(()=>{const t=encodeURIComponent(document.title||'');" +
      "const u=encodeURIComponent(location.href||'');" +
      "window.open('" + target.toString().replaceAll("'", "\\'") + "?add=1&title='+t+'&url='+u,'_blank');})();";
    return js;
  }

  function maybeAutoAddFromQuery() {
    const p = new URLSearchParams(location.search);
    if (p.get("add") !== "1") return;

    const title = p.get("title") ? decodeURIComponent(p.get("title")) : "";
    const url = p.get("url") ? decodeURIComponent(p.get("url")) : "";

    openModal("new", { title, url, type: "paper" });

    const clean = new URL(location.href);
    clean.searchParams.delete("add");
    clean.searchParams.delete("title");
    clean.searchParams.delete("url");
    history.replaceState({}, "", clean.toString());
  }

  btnAdd.addEventListener("click", () => openModal("new"));
  btnClose.addEventListener("click", closeModal);
  btnCancel.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  btnSave.addEventListener("click", upsert);
  btnDelete.addEventListener("click", () => {
    if (!editingId) return;
    removeItem(editingId);
    closeModal();
  });

  btnFetch.addEventListener("click", fetchFromCrossrefForForm);

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.getAttribute("data-id");
    const act = btn.getAttribute("data-act");
    const it = items.find(x => x.id === id);
    if (!it) return;

    if (act === "fav") toggleFavorite(id);
    if (act === "edit") openModal("edit", it);
    if (act === "del") removeItem(id);
    if (act === "refresh") refreshItemFromCrossref(id);
    if (act === "ris") downloadRIS(it);
  });

  [qEl, tagFilterEl, favoriteFilterEl, sortByEl, typeFilterEl].forEach(el => {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  btnExport.addEventListener("click", exportJson);

  btnImport.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files?.[0];
    if (f) importJsonFromFile(f);
    fileInput.value = "";
  });

  btnClear.addEventListener("click", clearAll);

  btnQuickAdd.addEventListener("click", quickAddFromQuery);
  quickQueryEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") quickAddFromQuery();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !modal.classList.contains("open")) {
      e.preventDefault();
      qEl.focus();
    }
    if ((e.key === "n" || e.key === "N") && !modal.classList.contains("open")) {
      openModal("new");
    }
    if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
  });

  loadStorage();
  render();
  document.getElementById("bookmarkletText").textContent = buildBookmarklet();
  maybeAutoAddFromQuery();
})();
</script>
</body>
</html>
